services:
  mysql:
    image: mysql:8.4
    environment:
      # Local development only. The app signs in as root so `prisma migrate dev` can create
      # its temporary shadow database.
      MYSQL_ROOT_PASSWORD: sakan
      MYSQL_DATABASE: sakan
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psakan"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
