services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sakan
      POSTGRES_PASSWORD: sakan
      POSTGRES_DB: sakan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakan"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
