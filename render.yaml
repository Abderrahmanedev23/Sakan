# Render Blueprint for the Sakan API (free plan).
# Optional: Render may ask for a payment card to use Blueprints. docs/DEPLOY.md creates the
# same service by hand instead; keep the two in sync. Values marked "sync: false" are asked
# for in the dashboard when the Blueprint is first applied.
services:
  - type: web
    name: sakan-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter "@sakan/api..." build
    # The free plan has no pre-deploy step, so migrations run when the server starts.
    startCommand: corepack pnpm --filter @sakan/api start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PAYMENT_PROVIDER
        value: stub
      - key: AUTH_SESSION_TTL_DAYS
        value: "30"
      - key: STORAGE_DRIVER
        value: s3
      # Aiven MySQL: the Service URI with ?ssl-mode=REQUIRED replaced by ?sslaccept=accept_invalid_certs.
      - key: DATABASE_URL
        sync: false
      # Upstash: the rediss:// URL.
      - key: REDIS_URL
        sync: false
      # The Vercel address of the web app, e.g. https://sakan.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # CIN scans: a private Supabase Storage bucket, reached through its S3 API.
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
